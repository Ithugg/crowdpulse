# Smallest valid config: used by test_config_schemas.py to check the defaults of load_settings().
sources:
  lobby:
    path: media/lobby.mp4
  stage:
    label: Stage
    kind: webcam
    path: 0
    hfov_deg: 75
    calibration: {cam_height_m: 4.5, tilt_deg: 20}
    moving_camera: true
    zones:
      - {id: front, name: Front, polygon: [[0.0, 0.0], [1.0, 0.0], [1.0, 1.0]]}
    gates:
      - {id: door, name: Door, line: [[0.1, 0.5], [0.9, 0.5]], zone: front}
