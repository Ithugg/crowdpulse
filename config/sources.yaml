# Camera sources and their zones. Zone polygons are normalized 0-1 image coordinates (x, y).
#
# Nothing here says how big a zone is: real distances are MEASURED from the video. The people in view
# act as a ruler (average height 1.7 m), which gives the camera's height and tilt and therefore the
# real floor position of every person. `calibration` stores that result for a clip (written by
# scripts/calibrate.py); a source without it is calibrated live while it runs. The only assumption
# per camera is the lens field of view, `hfov_deg` (default 60).

# Local density in people/m2 where each level starts (sources: backend/zones.py and the README).
thresholds:
  busy: 2.0        # movement constrained; event guidance plans for 2/m2 (Still)
  caution: 4.0     # action level: guidance figure for a moving queue (Still)
  danger: 5.0      # upper limit for standing areas, physical contact (Still)
  critical: 6.0    # no stable stance, surges start (Still; Helbing et al. 2007)
  exposure_alert_s: 360   # alert when a zone stays above `caution` for 6 minutes (our setting)

detector:
  weights: yolov8n.pt
  imgsz: 640
  conf: 0.25

stream:
  max_fps: 15
  width: 960
  jpeg_quality: 70

default_source: webcam

sources:
  webcam:
    label: Live Camera
    kind: webcam
    path: 0
    measure: size
    # Feet are usually out of frame on a table-top webcam, so distance comes from apparent body size.
    zones:
      - {id: left, name: Left Aisle, polygon: [[0.0, 0.0], [0.33, 0.0], [0.33, 1.0], [0.0, 1.0]]}
      - {id: center, name: Center Floor, polygon: [[0.33, 0.0], [0.67, 0.0], [0.67, 1.0], [0.33, 1.0]]}
      - {id: right, name: Right Aisle, polygon: [[0.67, 0.0], [1.0, 0.0], [1.0, 1.0], [0.67, 1.0]]}

  festival_plaza:
    label: Festival Plaza
    kind: video
    path: media/festival_plaza.mp4
    calibration: {cam_height_m: 8.3, tilt_deg: 10.3}   # measured by scripts/calibrate.py
    replay: media/cache/festival_plaza.npz   # sliced detection, yolov8s @ 960, 3x2 tiles (scripts/precompute.py)
    # Filmed from a slowly moving drone, so zones are parts of the view rather than fixed landmarks,
    # and people cannot be followed between frames (no walking speed or gate counts).
    moving_camera: true
    zones:
      - {id: stage_audience, name: Stage Audience, polygon: [[0.22, 0.42], [0.62, 0.42], [0.66, 0.62], [0.18, 0.62]]}
      - {id: stall_walkway, name: Food Stall Walkway, polygon: [[0.62, 0.25], [0.80, 0.25], [0.92, 0.62], [0.66, 0.62]]}
      - {id: front_plaza, name: Front Plaza, polygon: [[0.0, 0.67], [1.0, 0.67], [1.0, 1.0], [0.0, 1.0]]}

  parade_street:
    label: Festival Street Parade
    kind: video
    path: media/ade_street.mp4
    replay: media/cache/parade_street.npz   # sliced detection, yolov8s @ 960, 4x3 tiles (scripts/precompute.py)
    measure: size   # packed crowd: feet are hidden, so distance comes from body size
    zones:
      - {id: parade_front, name: Parade Front, polygon: [[0.0, 0.64], [1.0, 0.64], [1.0, 1.0], [0.0, 1.0]]}
      - {id: mid_street, name: Mid Street, polygon: [[0.0, 0.44], [1.0, 0.44], [1.0, 0.64], [0.0, 0.64]]}
      - {id: far_street, name: Far Street, polygon: [[0.0, 0.26], [1.0, 0.26], [1.0, 0.44], [0.0, 0.44]]}

  concourse:
    label: Gate 3 Concourse
    kind: video
    path: media/MOT20-02.mp4
    calibration: {cam_height_m: 5.0, tilt_deg: 19.2}   # measured by scripts/calibrate.py
    gates:
      - {id: gate3, name: Gate 3, line: [[0.14, 0.56], [0.82, 0.52]], zone: main_floor}
    zones:
      - {id: ticket_hall, name: Ticket Hall, polygon: [[0.24, 0.26], [0.50, 0.26], [0.50, 0.56], [0.14, 0.56]]}
      - {id: gate_entry, name: Gate 3 Entry, polygon: [[0.50, 0.24], [0.72, 0.24], [0.74, 0.52], [0.50, 0.54]]}
      - {id: east_corridor, name: East Corridor, polygon: [[0.74, 0.32], [0.90, 0.32], [0.93, 0.56], [0.74, 0.52]]}
      - {id: main_floor, name: Main Floor, polygon: [[0.0, 0.56], [0.82, 0.52], [0.86, 1.0], [0.0, 1.0]]}

  plaza:
    label: East Plaza
    kind: video
    path: media/MOT20-03.mp4
    calibration: {cam_height_m: 8.4, tilt_deg: 32.8}   # measured by scripts/calibrate.py
    gates:
      - {id: crosswalk_line, name: Crosswalk, line: [[0.50, 0.50], [0.0, 0.50]], zone: crosswalk}
    zones:
      - {id: crosswalk, name: Crosswalk Approach, polygon: [[0.0, 0.0], [0.50, 0.0], [0.50, 0.50], [0.0, 0.50]]}
      - {id: stadium_gate, name: Stadium Gate, polygon: [[0.50, 0.15], [0.86, 0.15], [0.86, 0.52], [0.50, 0.52]]}
      - {id: west_plaza, name: West Plaza, polygon: [[0.0, 0.50], [0.50, 0.50], [0.50, 1.0], [0.0, 1.0]]}
      - {id: east_plaza, name: East Plaza, polygon: [[0.50, 0.52], [1.0, 0.52], [1.0, 1.0], [0.50, 1.0]]}

  main_field:
    label: Main Stage Field
    kind: video
    path: media/MOT20-05.mp4
    calibration: {cam_height_m: 8.1, tilt_deg: 37.5}   # measured by scripts/calibrate.py
    replay: media/cache/main_field.npz   # detections precomputed with yolov8s @ 1280 (scripts/precompute.py)
    zones:
      - {id: stage_left, name: Stage Left, polygon: [[0.0, 0.0], [0.50, 0.0], [0.50, 0.50], [0.0, 0.50]]}
      - {id: stage_right, name: Stage Right, polygon: [[0.50, 0.0], [1.0, 0.0], [1.0, 0.50], [0.50, 0.50]]}
      - {id: mid_field, name: Mid Field, polygon: [[0.0, 0.50], [0.50, 0.50], [0.50, 1.0], [0.0, 1.0]]}
      - {id: gate_walkway, name: Gate 2 Walkway, polygon: [[0.50, 0.50], [1.0, 0.50], [1.0, 1.0], [0.50, 1.0]]}

  # Not a camera. A drill: a scripted crowd on a virtual floor, seen by a virtual camera, measured by
  # the same code as the real ones and labelled DRILL everywhere (backend/drill.py). It exists because
  # no footage here reaches the action level and real readings are never scaled.
  drill:
    label: Drill
    kind: drill
    calibration: {cam_height_m: 9.0, tilt_deg: 40.0}   # the virtual camera's pose, chosen, not measured
    # Each polygon is a rectangle of floor seen in perspective by that camera (metres: sideways x forward).
    zones:
      - {id: front_barrier, name: Front Barrier, polygon: [[0.1898, 0.4540], [0.5477, 0.4540], [0.5648, 0.9005], [0.0786, 0.9005]]}   # 6.0 x 5.0
      - {id: centre_field, name: Centre Field, polygon: [[0.2644, 0.1544], [0.5362, 0.1544], [0.5432, 0.3351], [0.2194, 0.3351]]}    # 6.0 x 4.0
      - {id: exit_lane, name: East Exit Lane, polygon: [[0.6269, 0.1544], [0.7447, 0.1544], [0.9376, 0.9005], [0.7269, 0.9005]]}     # 2.6 x 11.0
